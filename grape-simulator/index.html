<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>グレープシミュレーター</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5a3390">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e;
               font-family: 'DotGothic16', system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
               user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  button { font-family: inherit; }
  input, textarea { font-family: inherit; user-select: text; -webkit-user-select: text; }
  .hidden { display: none !important; }

  /* ゲーム画面（画面いっぱい） */
  #game { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
  .hudbtn { width: 46px; height: 46px; padding: 0; border: 3px solid #000; border-radius: 10px; background: #fff; color: #222;
            font-size: 22px; line-height: 1; box-shadow: 0 4px 0 #000; cursor: pointer; touch-action: manipulation;
            display: flex; align-items: center; justify-content: center; }
  .hudbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
  .hudbtn.on { background: #e0a800; }
  #btnItems { position: fixed; top: 10px; left: 10px; width: 56px; height: 56px; font-size: 36px; font-weight: bold;
              background: #6ccf5f; color: #10301a; }
  #stats { position: fixed; top: 18px; left: 78px; color: #fff; background: rgba(0,0,0,.45); padding: 6px 10px;
           border-radius: 8px; font-size: 15px; pointer-events: none; white-space: nowrap; }
  #hudRight { position: fixed; top: 10px; right: 10px; display: flex; gap: 8px; }
  #zoomBtns { position: fixed; right: 10px; bottom: 14px; display: flex; gap: 8px; }
  #zoomBtns .hudbtn { width: auto; padding: 0 14px; font-size: 18px; font-weight: bold; }
  #trash { position: fixed; left: 50%; bottom: 14px; width: 76px; height: 76px; margin-left: -38px; z-index: 4;
           display: flex; align-items: center; justify-content: center; font-size: 40px; pointer-events: none;
           background: rgba(0,0,0,.45); border: 3px dashed #fff; border-radius: 50%; box-sizing: border-box; }
  #trash.hot { background: #d23a2a; border-style: solid; transform: scale(1.15); }
  #rotBtns { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 104px; z-index: 4; }
  #rotBtns .hudbtn { width: 56px; height: 56px; font-size: 30px; font-weight: bold; }
  #hint { position: fixed; left: 10px; bottom: 14px; max-width: calc(100% - 240px); z-index: 3; box-sizing: border-box;
          color: #fff; background: rgba(0,0,0,.6); padding: 8px 14px; border-radius: 10px; font-size: 15px; text-align: center;
          pointer-events: none; }

  /* アイテムのひきだし（メロンサンドボックスみたいに、ここからスワイプして出す） */
  #drawer { position: fixed; top: 0; left: 0; bottom: 0; width: min(400px, 50vw); z-index: 5; box-sizing: border-box;
            background: #1e142c; border-right: 4px solid #000; color: #fff; display: flex; flex-direction: column;
            transform: translateX(-105%); transition: transform .18s ease-out; }
  #drawer.open { transform: none; }
  #drawerTop { display: flex; gap: 6px; padding: 8px; align-items: flex-start; }
  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; }
  #tabs button { padding: 6px 2px; font-size: 15px; font-weight: bold; border: 3px solid #000; border-radius: 10px;
                 background: #ddd; color: #222; cursor: pointer; white-space: nowrap; }
  #tabs button.on { background: #6ccf5f; }
  #btnDrawerClose { width: 40px; height: 40px; font-size: 20px; flex: 0 0 auto; }
  #items { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; padding: 4px 8px 8px;
           overflow-y: auto; }
  .item { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100px;
          padding: 6px 4px; box-sizing: border-box; background: #fff; color: #222; border: 3px solid #000; border-radius: 10px;
          box-shadow: 0 4px 0 #000; font-size: 13px; font-weight: bold; touch-action: none; cursor: grab; text-align: center; }
  .item canvas { image-rendering: pixelated; flex: 0 0 auto; }
  .item.locked { background: #b9b4c4; cursor: pointer; }
  .item.locked canvas { filter: grayscale(1) brightness(.55); }
  .item .price { font-size: 12px; color: #5a3390; }
  .item.make { font-size: 34px; background: #6ccf5f; color: #10301a; cursor: pointer; font-family: inherit; }
  .item.make span { font-size: 13px; }
  #drawerHint { padding: 0 10px 10px; font-size: 12px; line-height: 1.5; opacity: .85; }
  #ghost { position: fixed; left: 0; top: 0; z-index: 10; pointer-events: none; image-rendering: pixelated; opacity: .8; }

  /* スマホがたて向きのとき */
  #rotate { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 16px; padding: 16px; background: #5a3390; color: #fff; font-size: 24px; text-align: center; }
  #rotate .phone { font-size: 72px; animation: turn 1.8s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }

  /* ホーム・マップ選択・せってい */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center;
            gap: 16px; padding: 16px; box-sizing: border-box; color: #fff; text-align: center; overflow: auto;
            background: #5a3390 repeating-conic-gradient(#64399f 0 25%, #5a3390 0 50%) 0 0 / 24px 24px; }
  .screen h1 { font-size: clamp(30px, 8vw, 60px); margin: 0; line-height: 1.15; text-shadow: 4px 4px 0 #000; }
  .screen h2 { font-size: clamp(22px, 5vw, 36px); margin: 0; text-shadow: 3px 3px 0 #000; }
  .screen .ver { margin: 0; opacity: .7; font-size: 13px; }
  #mascot { width: 108px; height: 132px; image-rendering: pixelated; }
  button.big { font-size: clamp(22px, 5vw, 32px); font-weight: bold; padding: 14px 48px; background: #6ccf5f; color: #10301a;
               border: 4px solid #000; border-radius: 12px; box-shadow: 0 6px 0 #000; cursor: pointer; }
  button.small { font-size: 16px; font-weight: bold; padding: 8px 20px; background: #fff; color: #222;
                 border: 3px solid #000; border-radius: 10px; box-shadow: 0 4px 0 #000; cursor: pointer; }
  button.big:active, button.small:active, button.map:active, .seg button:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }
  #mapList { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; max-width: 980px; }
  button.map { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px; width: 176px;
               background: #fff; color: #222; border: 4px solid #000; border-radius: 12px; box-shadow: 0 6px 0 #000; cursor: pointer; }
  button.map b { font-size: 18px; }
  button.map small { font-size: 12px; color: #555; }
  .thumb { width: 144px; height: 96px; border: 2px solid #000; border-radius: 4px; }
  #settingsGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px 28px; width: min(100%, 860px); }
  .setting { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .setting span { font-size: 16px; text-shadow: 2px 2px 0 #000; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .seg button { font-size: 15px; font-weight: bold; padding: 8px 14px; background: #fff; color: #222;
                border: 3px solid #000; border-radius: 10px; box-shadow: 0 4px 0 #000; cursor: pointer; }
  .seg button.on { background: #6ccf5f; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .note { margin: 0; font-size: 14px; line-height: 1.6; max-width: 720px; text-shadow: 2px 2px 0 #000; }

  /* コイン */
  .coin { position: absolute; top: 12px; right: 12px; font-size: 20px; font-weight: bold; background: #ffd24a; color: #3a2a00;
          border: 3px solid #000; border-radius: 20px; padding: 4px 14px; box-shadow: 0 4px 0 #000; cursor: default; }
  #toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 40; max-width: calc(100% - 32px);
           box-sizing: border-box; background: #ffd24a; color: #3a2a00; border: 3px solid #000; border-radius: 12px;
           box-shadow: 0 5px 0 #000; padding: 8px 18px; font-size: 17px; font-weight: bold; text-align: center; pointer-events: none; }
  #toast.pop { animation: toastIn .25s ease-out; }
  @keyframes toastIn { from { transform: translate(-50%, -30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

  /* ショップ */
  #shopList { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 1000px; }
  #shopList h3 { margin: 14px 0 0; font-size: 24px; text-shadow: 3px 3px 0 #000; }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 170px; padding: 10px 8px; box-sizing: border-box;
          background: #fff; color: #222; border: 4px solid #000; border-radius: 12px; box-shadow: 0 6px 0 #000; }
  .card canvas { image-rendering: pixelated; }
  .card b { font-size: 17px; }
  .card small { font-size: 12px; color: #555; line-height: 1.4; min-height: 34px; }
  .card.owned { background: #e2f7dd; }
  .card.focus { outline: 5px solid #ffd24a; }
  .card .have { font-weight: bold; color: #2f7a2f; }
  .card button.small { font-size: 14px; padding: 5px 10px; }
  button.buy { font-size: 17px; font-weight: bold; padding: 6px 16px; background: #ffd24a; color: #3a2a00; border: 3px solid #000;
               border-radius: 10px; box-shadow: 0 4px 0 #000; cursor: pointer; }
  button.buy.sure { background: #6ccf5f; color: #10301a; }
  button.buy.short { background: #ddd; color: #a02020; }
  button.buy:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }

  /* クエスト */
  #questList { display: flex; flex-direction: column; gap: 8px; width: min(100%, 760px); }
  .qsum { margin: 0; font-size: 18px; text-shadow: 2px 2px 0 #000; }
  .qsum span + span { margin-left: 1.6em; }
  .quest { display: grid; grid-template-columns: 30px 1fr 120px 70px 62px; align-items: center; gap: 8px; padding: 8px 12px;
           background: #fff; color: #222; border: 3px solid #000; border-radius: 10px; text-align: left; }
  .quest.done { background: #e2f7dd; color: #555; }
  .quest .mark { font-size: 20px; text-align: center; }
  .quest .bar { height: 12px; background: #ddd; border: 2px solid #000; border-radius: 6px; overflow: hidden; }
  .quest .bar i { display: block; height: 100%; background: #6ccf5f; }
  .quest small { font-size: 13px; text-align: right; }
  .quest b { color: #8a6400; text-align: right; }

  /* モッドエディター */
  #modsRoot, .panel { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  #modCards { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 1000px; }
  .modCard { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 200px; padding: 10px 8px; box-sizing: border-box;
             background: #fff; color: #222; border: 4px solid #000; border-radius: 12px; box-shadow: 0 6px 0 #000; }
  .modCard small { color: #555; }
  .modCard .sale { color: #8a6400; font-weight: bold; }
  .modCard.locked { background: #d9d4e2; }
  .acts { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  .acts button, .tools button, .edTop button { font-size: 13px; padding: 5px 9px; }
  button.sure { background: #d23a2a; color: #fff; }
  button.go { background: #6ccf5f; }
  .pix { image-rendering: pixelated; }
  .edTop { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  .edTop .tag { font-size: 15px; background: #000; padding: 4px 10px; border-radius: 8px; }
  .nameIn { font-size: 17px; padding: 6px 10px; width: 170px; border: 3px solid #000; border-radius: 10px; }
  .edMain { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; align-items: flex-start; }
  .edLeft { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #edGrid { touch-action: none; border: 3px solid #000; background: #fff; cursor: crosshair; }
  .tools, .palette { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 560px; }
  .tools button.on { background: #6ccf5f; }
  .swatch { width: 30px; height: 30px; padding: 0; border: 3px solid #000; border-radius: 6px; cursor: pointer; }
  .swatch.on { outline: 4px solid #ffd24a; outline-offset: 1px; }
  .pick { display: flex; align-items: center; gap: 4px; font-size: 13px; }
  .pick input { width: 40px; height: 30px; padding: 0; border: 2px solid #000; }
  .edRight { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 260px; max-width: 360px; padding: 12px;
             background: rgba(0, 0, 0, .35); border-radius: 12px; }
  .edRight .preview { background: #a9cfe8; border: 2px solid #000; }
  .field { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .field > span { font-size: 14px; text-shadow: 2px 2px 0 #000; }
  .field .seg button { font-size: 13px; padding: 5px 9px; }
  .colors { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .colors input[type=color] { width: 48px; height: 34px; padding: 0; border: 2px solid #000; }
  .range { display: flex; align-items: center; gap: 8px; }
  .range button { font-size: 16px; padding: 2px 12px; background: #fff; border: 3px solid #000; border-radius: 8px; cursor: pointer; }
  #dialog { position: fixed; inset: 0; z-index: 35; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .6); }
  #dialog .box { display: flex; flex-direction: column; gap: 10px; width: min(92vw, 520px); max-height: calc(100% - 24px); overflow: auto;
                 padding: 16px; box-sizing: border-box; background: #fff; color: #222; border: 4px solid #000; border-radius: 12px; }
  #dialog .note, #dialog .field > span { text-shadow: none; }
  #dialog textarea { width: 100%; height: 110px; box-sizing: border-box; font: 12px/1.4 monospace; word-break: break-all; }
  #dialog .seg button { font-size: 14px; padding: 5px 10px; }
  .setting .nameIn { text-align: center; }
  .err { margin: 0; color: #c02020; font-size: 14px; }
  @media (max-height: 500px) {   /* 横向きのスマホ */
    .screen { gap: 10px; padding: 10px; }
    .screen h1 { font-size: 40px; }
    #mascot { width: 72px; height: 88px; }
    #mapList { gap: 10px; }
    button.map { width: 136px; padding: 6px; }
    button.map b { font-size: 15px; }
    button.map small { display: none; }
    .thumb { width: 116px; height: 64px; }
    #settingsGrid { gap: 10px 20px; }
    .card { width: 150px; padding: 6px; }
    .card small { min-height: 0; }
    .quest { grid-template-columns: 26px 1fr 80px 60px 56px; padding: 5px 8px; }
    .coin { top: 8px; right: 8px; font-size: 16px; }
    button.big { font-size: 24px; padding: 8px 40px; }
    .screen h1 { font-size: 34px; }
    .edMain { flex-wrap: nowrap; gap: 10px; }
    .edLeft { max-width: 52vw; }
    .tools, .palette { gap: 4px; }
    .tools button { font-size: 12px; padding: 4px 6px; }
    .swatch { width: 24px; height: 24px; }
    .edRight { min-width: 0; max-width: 44vw; padding: 8px; gap: 6px; }
    .field .seg button { font-size: 12px; padding: 4px 7px; }
    #toast { top: 76px; font-size: 14px; padding: 6px 12px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="btnItems" class="hudbtn hidden" aria-label="アイテム" data-i18n-aria>＋</button>
<div id="stats" class="hidden"></div>
<div id="hudRight" class="hidden">
  <button id="btnSlow" class="hudbtn" aria-label="スロー" data-i18n-aria>🐢</button>
  <button id="btnPause" class="hudbtn" aria-label="一時停止" data-i18n-aria>⏸</button>
  <button id="btnClear" class="hudbtn" aria-label="ぜんぶ消す" data-i18n-aria>🧹</button>
  <button id="btnFull" class="hudbtn hidden" aria-label="全画面" data-i18n-aria>
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6" fill="none" stroke="#222" stroke-width="3"/></svg>
  </button>
  <button id="btnMap" class="hudbtn" aria-label="マップ" data-i18n-aria>🗺</button>
</div>
<div id="zoomBtns" class="hidden">
  <button id="btnLoose" class="hudbtn" data-i18n>ルーズ</button>
  <button id="btnUp" class="hudbtn" data-i18n>アップ</button>
</div>
<div id="trash" class="hidden">🗑</div>
<div id="rotBtns" class="hidden">
  <button id="btnRotL" class="hudbtn" aria-label="左に回す" data-i18n-aria>⟲</button>
  <button id="btnRotR" class="hudbtn" aria-label="右に回す" data-i18n-aria>⟳</button>
</div>
<div id="hint" class="hidden"></div>
<div id="drawer">
  <div id="drawerTop">
    <div id="tabs"></div>
    <button id="btnDrawerClose" class="hudbtn" aria-label="とじる" data-i18n-aria>✕</button>
  </div>
  <div id="items"></div>
  <div id="drawerHint"></div>
</div>
<canvas id="ghost" class="hidden"></canvas>
<div id="rotate" class="hidden"><div class="phone">📱</div><span data-i18n>スマホを横にしてね</span></div>

<div id="toast" class="hidden"></div>
<div id="dialog" class="hidden"></div>

<div id="home" class="screen">
  <div id="coinPill" class="coin">🪙 <span id="coinHome">0</span></div>
  <canvas id="mascot" width="9" height="11"></canvas>
  <h1><span data-i18n>グレープ</span><br><span data-i18n>シミュレーター</span></h1>
  <button id="btnPlay" class="big" data-i18n>▶ プレイ</button>
  <div class="row">
    <button id="btnQuests" class="small" data-i18n>📜 クエスト</button>
    <button id="btnShop" class="small" data-i18n>🛒 ショップ</button>
    <button id="btnMods" class="small" data-i18n>🛠 モッド</button>
    <button id="btnSettings" class="small" data-i18n>⚙ せってい</button>
  </div>
  <p class="ver"><span data-i18n>ブラウザ版</span> 0.8</p>
</div>

<div id="shop" class="screen hidden">
  <h2 data-i18n>🛒 ショップ</h2>
  <p class="note"><span data-i18n>コインは、クエストをクリアしたり、キャラをたおしたりすると、もらえる。いま</span> 🪙 <b id="shopCoins">0</b></p>
  <div id="shopList"></div>
  <button id="btnShopBack" class="small" data-i18n>← もどる</button>
</div>

<div id="quests" class="screen hidden">
  <h2 data-i18n>📜 クエスト</h2>
  <p class="note" data-i18n>クリアすると、コインがもらえる。コインはショップで使える。</p>
  <div id="questList"></div>
  <button id="btnQuestsBack" class="small" data-i18n>← もどる</button>
</div>

<div id="mods" class="screen hidden">
  <div id="modsRoot"></div>
  <button id="btnModsBack" class="small" data-i18n>← もどる</button>
</div>

<div id="maps" class="screen hidden">
  <h2 data-i18n>マップをえらぶ</h2>
  <div id="mapList"></div>
  <button id="btnHome" class="small" data-i18n>← ホーム</button>
</div>

<div id="settings" class="screen hidden">
  <h2 data-i18n>せってい</h2>
  <div id="settingsGrid">
    <div class="setting"><span>ことば / Language</span>
      <div class="seg" data-key="lang"><button data-v="ja">日本語</button><button data-v="en">English</button></div></div>
    <div class="setting"><span data-i18n>あなたの名前（モッドを売り買いするときに出る）</span>
      <input id="playerName" class="nameIn" type="text" maxlength="12" placeholder="なまえ" data-i18n-ph></div>
    <div class="setting"><span data-i18n>血の量</span>
      <div class="seg" data-key="blood"><button data-v="0" data-i18n>なし</button><button data-v="1" data-i18n>ふつう</button><button data-v="2" data-i18n>多め</button></div></div>
    <div class="setting"><span data-i18n>血の色</span>
      <div class="seg" data-key="rainbow"><button data-v="0" data-i18n>ふつう</button><button data-v="1">🔒 にじ色</button></div></div>
    <div class="setting"><span data-i18n>ケガのしやすさ</span>
      <div class="seg" data-key="damage"><button data-v="0.5" data-i18n>丈夫</button><button data-v="1" data-i18n>ふつう</button><button data-v="2" data-i18n>もろい</button></div></div>
    <div class="setting"><span data-i18n>キャラの大きさ（はじめのズーム）</span>
      <div class="seg" data-key="size"><button data-v="0" data-i18n>小さい</button><button data-v="1" data-i18n>ふつう</button><button data-v="2" data-i18n>大きい</button></div></div>
    <div class="setting"><span data-i18n>出てくる向き</span>
      <div class="seg" data-key="facing"><button data-v="0" data-i18n>ランダム</button><button data-v="1" data-i18n>右</button><button data-v="-1" data-i18n>左</button></div></div>
